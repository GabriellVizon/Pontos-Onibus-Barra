<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarraBus - Pontos e Horários</title>

    <meta name="description" content="BarraBus — horários e próximas saídas dos pontos de ônibus de Barra Bonita, SP. Consulte a tabela por dia da semana, veja o mapa e trace sua rota.">
    <meta name="author" content="BarraBus">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="BarraBus">
    <meta property="og:description" content="Pontos e horários de ônibus em Barra Bonita">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://barrabus.app">
    <meta property="og:locale" content="pt_BR">

    <meta name="theme-color" content="#e53935">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com;
        img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org https://tile.openstreetmap.org;
        font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
        connect-src 'self' https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://unpkg.com https://cdn.jsdelivr.net;
        upgrade-insecure-requests
    ">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
    <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org">
    <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org">
    <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org">

    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/dist/tabler-icons.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="pontos.css">
</head>
<body>
    <template id="pageContentTemplate">
        <!-- Content -->
        <div class="content">
            <!-- Main Column -->
            <div class="content-main">
                <h1 class="page-title">Pontos de Ônibus</h1>
                <p class="page-subtitle" id="pageSubtitle">Carregando pontos cadastrados em Barra Bonita.</p>

                <!-- Line Detail Card -->
                <div class="line-detail-card">
                    <div class="line-header">
                        <div>
                            <p class="line-label">PONTO SELECIONADO</p>
                            <h2 class="line-name" id="selectedPointName">Nenhum ponto selecionado</h2>
                        </div>
                        <div class="live-badge">
                            <div class="live-dot"></div>
                            <span class="live-text" id="locationStatus">GPS</span>
                        </div>
                    </div>

                    <!-- Info Cards -->
                    <div class="info-cards">
                        <div class="info-card">
                            <div class="info-card-header">
                                <i class="ti ti-map-pin"></i>
                                <span class="info-card-label">DISTÂNCIA</span>
                            </div>
                            <span class="info-card-value small-value" id="selectedDistance">Aguardando
                                localização</span>
                            <p class="info-card-sub" id="selectedAddress">Permita o GPS para ordenar por proximidade.
                            </p>
                        </div>
                        <div class="info-card">
                            <div class="info-card-header">
                                <i class="ti ti-route"></i>
                                <span class="info-card-label">PRÓXIMO ÔNIBUS</span>
                            </div>
                            <span class="info-card-value small-value" id="selectedLine">Rota Circular</span>
                            <p class="info-card-sub" id="selectedNext">Próxima saída calculada pelo horário atual.</p>
                        </div>
                    </div>

                    <!-- Schedule -->
                    <div class="schedule-header">
                        <span class="schedule-title">Tabela de Horários</span>
                    </div>

                    <div class="schedule-table" id="scheduleTable">
                        <tbody id="scheduleBody"></tbody>
                    </div>
                    <p class="schedule-note" id="scheduleNote">Selecione um ponto para ver a próxima saída.</p>
                </div>
                <div class="points-grid" id="pointsGrid" aria-live="polite"></div>
                <div class="show-more-container" id="showMoreContainer"></div>
            </div>

            <!-- Sidebar Column -->
            <aside class="content-sidebar">
                <!-- Map Card -->
                <div class="map-card">
                    <div id="routeMap" class="route-map" aria-label="Mapa dos pontos de ônibus"></div>
                    <div class="map-btn" id="mapBtn">
                        <i class="ti ti-arrows-maximize"></i>
                        <span>Ver Mapa Completo</span>
                    </div>
                </div>

                <!-- Stops Card -->
                <div class="stops-card">
                    <div class="stops-header">
                        <span class="stops-title">Pontos</span>
                        <span class="stops-count">14 PARADAS</span>
                    </div>
                    <ul class="sidebar-items" id="sidebarItems"></ul>
                </div>
            </aside>
        </div>
    </template>

    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/favorites.js"></script>
    <script defer src="js/reminders.js"></script>
    <script defer src="js/modal.js"></script>
    <script defer src="js/appShell.js"></script>
    <script defer src="js/bootstrap-points.js"></script>
    <script defer src="js/pontos.js"></script>
</body>

</html>
